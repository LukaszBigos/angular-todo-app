<div class="page-shell">
  <main class="todo-container">
    <section class="todo-panel">
      <header class="todo-header">
        <p class="todo-kicker">Todo app</p>
        <h1 class="todo-title">My Tasks</h1>
      </header>

      <app-todo-form (add)="addTodo($event)" />

      <app-todo-list
        [todos]="todos()"
        [editingTodoId]="editingTodoId()"
        [editingText]="editingText()"
        (toggle)="toggleTodo($event.id, $event.completed)"
        (delete)="deleteTodo($event)"
        (startEdit)="startEdit($event)"
        (saveEdit)="saveEdit($event)"
        (cancelEdit)="cancelEdit()"
        (editingTextChange)="setEditingText($event)"
      />
    </section>
  </main>
</div>
