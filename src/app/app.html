<div class="min-h-screen bg-slate-100 px-4 py-10 text-slate-800">
  <main class="mx-auto max-w-2xl">
    <section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
      <header class="mb-6">
        <p class="text-xs font-semibold uppercase tracking-[0.2em] text-sky-600">Todo app</p>
        <h1 class="mt-3 text-3xl font-bold tracking-tight text-slate-900">My Tasks</h1>
      </header>

      <form
        class="mb-6 flex flex-col gap-3 sm:flex-row"
        (submit)="$event.preventDefault(); addTodo()"
      >
        <input
          [value]="newTodo()"
          (input)="newTodo.set($event.target.value)"
          type="text"
          placeholder="Add a new task..."
          class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 text-base text-slate-900 outline-none transition focus:border-sky-500 focus:ring-4 focus:ring-sky-100"
        />

        <button
          type="submit"
          class="rounded-xl bg-sky-600 px-5 py-3 font-medium text-white shadow-sm transition hover:bg-sky-500 focus:outline-none focus:ring-4 focus:ring-sky-200"
        >
          Add
        </button>
      </form>

      <ul class="space-y-3">
        @for (todo of todos(); track todo.id) {
          <li
            class="flex items-center justify-between gap-3 rounded-xl border border-slate-200 bg-slate-50 px-4 py-3"
          >
            <label class="flex items-center gap-3">
              <input
                type="checkbox"
                [checked]="todo.completed"
                (change)="toggleTodo(todo.id, $event)"
                class="h-4 w-4 rounded border-slate-300 text-sky-600 focus:ring-sky-500"
              />
              <span
                class="text-base text-slate-700"
                [class.line-through]="todo.completed"
                [class.text-slate-400]="todo.completed"
              >
                {{ todo.text }}
              </span>
            </label>
          </li>
        } @empty {
          <li
            class="rounded-xl border border-dashed border-slate-300 bg-slate-50 px-4 py-8 text-center text-slate-500"
          >
            No tasks yet. Add your first one!
          </li>
        }
      </ul>
    </section>
  </main>
</div>
