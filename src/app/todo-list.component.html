<ul class="todo-list">
  @for (todo of todos; track todo.id) {
    <li class="todo-item">
      @if (editingTodoId === todo.id) {
        <div class="todo-edit-row">
          <input
            [value]="editingText"
            (input)="onInputEdit($any($event.target).value)"
            (keydown.enter)="onSaveEdit(todo.id)"
            class="todo-edit-input"
          />

          <button type="button" (click)="onSaveEdit(todo.id)" class="todo-button todo-button--save">
            Save
          </button>

          <button type="button" (click)="onCancelEdit()" class="todo-button todo-button--muted">
            Cancel
          </button>
        </div>
      } @else {
        <label class="todo-main">
          <input
            type="checkbox"
            class="todo-checkbox"
            [checked]="todo.completed"
            (change)="onToggle(todo.id, $event)"
          />

          <span class="todo-text" [class.is-complete]="todo.completed">
            {{ todo.text }}
          </span>
        </label>

        <div class="todo-actions">
          <button
            type="button"
            (click)="onStartEdit(todo)"
            class="todo-action todo-action--edit"
            aria-label="Edit task"
            title="Edit"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25ZM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83Z"
              />
            </svg>
          </button>

          <button
            type="button"
            (click)="onDelete(todo.id)"
            class="todo-action todo-action--delete"
            aria-label="Delete task"
            title="Delete"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M6 7h12l-1 13a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L6 7Zm3 2v9h2V9H9Zm4 0v9h2V9h-2ZM9 3h6l1 2h4v2H4V5h4l1-2Z"
              />
            </svg>
          </button>
        </div>
      }
    </li>
  } @empty {
    <li class="todo-empty">No tasks yet. Add your first one!</li>
  }
</ul>
